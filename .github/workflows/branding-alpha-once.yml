name: Make transparent official wordmark
on:
  push:
    branches: [work/backoffice-studio-convergence]
permissions:
  contents: write
jobs:
  cutout:
    if: github.event.head_commit.message == 'chore(branding): generate official transparent PNG'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare image processing
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Derive RGBA PNG from unmodified official artwork
        run: python scripts/make-transparent-wordmark.py
      - name: Validate alpha and original artwork
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open("artwork/branding/halloween-map-wordmark-official.webp")
          image = Image.open("public/brand/halloween-map-wordmark-transparent.png")
          assert image.mode == "RGBA"
          assert image.size == source.size
          assert image.getpixel((0,0))[3] == 0
          assert image.getpixel((image.width-1,image.height-1))[3] == 0
          alpha = image.getchannel("A")
          assert alpha.getextrema() == (0,255), alpha.getextrema()
          assert Path("artwork/branding/halloween-map-wordmark-transparent.png").read_bytes() == Path("public/brand/halloween-map-wordmark-transparent.png").read_bytes()
          print("Verified RGBA transparency and identical brand/public copies")
          PY
      - name: Commit only the two generated PNG variants
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artwork/branding/halloween-map-wordmark-transparent.png public/brand/halloween-map-wordmark-transparent.png
          git diff --cached --quiet && { echo "No generated changes"; exit 1; }
          git commit -m "fix(branding): add transparent PNG of official wordmark"
          git push origin HEAD:refs/heads/work/backoffice-studio-convergence
