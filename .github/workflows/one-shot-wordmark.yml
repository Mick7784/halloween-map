name: One-shot transparent wordmark generation
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: >-
      github.event.pull_request.number == 46 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'work/backoffice-studio-convergence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Install Pillow for exact logo-matte removal
        run: |
          python3 -m venv /tmp/halloween-wordmark-venv
          /tmp/halloween-wordmark-venv/bin/python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate two identical transparent branding assets
        run: /tmp/halloween-wordmark-venv/bin/python scripts/generate-wordmark-alpha.py
      - name: Commit only the generated logo variants
        run: |
          set -euo pipefail
          git add artwork/branding/halloween-map-wordmark-transparent.png public/brand/halloween-map-wordmark-transparent.png
          if git diff --cached --quiet; then
            echo 'Logo assets already identical to generator output'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(branding): add transparent official wordmark for Studio sidebar'
          git push origin HEAD:work/backoffice-studio-convergence
