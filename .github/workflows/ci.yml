name: CI and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: halloween-${{ github.ref }}
  # Only superseded PR checks may be cancelled; main releases finish normally.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: halloween
          POSTGRES_PASSWORD: ci-password-only
          POSTGRES_DB: halloween
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U halloween" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://halloween:ci-password-only@localhost:5432/halloween
      SEASON_E2E_DATABASE_URL: postgresql://halloween:ci-password-only@localhost:5432/halloween
      TEST_DATABASE_URL: postgresql://halloween:ci-password-only@localhost:5432/halloween
      APP_ORIGIN: http://localhost:3000
      SETUP_TOKEN: ci-setup-secret-with-sufficient-length
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run migrate
      - name: Verify migration idempotence
        run: npm run migrate
      - run: npm run lint
      - run: npm test
        # The unit suite freezes Date; PGlite shares that clock, unlike the
        # wall-clock PostgreSQL service retained for migrations and browser tests.
        env:
          TEST_DATABASE_URL: ""
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --max-failures=5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report
            test-results
          retention-days: 7
  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify the Docker stack
        run: |
          cp .env.example .env
          sed -i 's/replace-with-a-long-random-password/docker-ci-password/g; s/replace-with-a-random-setup-token/docker-ci-setup-secret/g' .env
          docker compose up -d --build --wait app worker
          curl --fail http://localhost:3000/api/health
          test "$(docker compose exec -T app cat VERSION | tr -d '\r\n')" = "$(cat VERSION | tr -d '\r\n')"
      - uses: docker/login-action@v3
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/v083-collection-seasons'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify isolated PR image
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/v083-collection-seasons'
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          image="ghcr.io/mick7784/halloween-map:pr-18-${PR_HEAD}"
          docker tag halloween-map:local "$image"
          docker push "$image"
          docker pull "$image"
          test "$(docker run --rm --entrypoint cat "$image" VERSION | tr -d '\r\n')" = "$(cat VERSION | tr -d '\r\n')"
          echo "Verified image: $image" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect "$image" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Logs
        if: always()
        run: docker compose logs --no-color
  https-media:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: halloween
          POSTGRES_PASSWORD: ci-https-password-only
          POSTGRES_DB: halloween
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U halloween" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://halloween:ci-https-password-only@localhost:5432/halloween
      APP_ORIGIN: https://127.0.0.1:3443
      COOKIE_SECURE: "true"
      SETUP_TOKEN: ci-https-setup-secret-with-sufficient-length
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test actual HTTPS media flow through a browser
        run: npx playwright test --config playwright.email-https.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report-https
          path: |
            playwright-report
            test-results
          retention-days: 7
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, docker, https-media]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read canonical version
        id: version
        run: |
          version=$(tr -d '\r\n' < VERSION)
          if [[ "$version" =~ -beta\.[1-9][0-9]*$ ]]; then
            echo "Prerelease version: stable publishing is disabled."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$version" =~ ^V[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          grep -Fqx "## $version" CHANGELOG.md
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "$version" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.publish == 'true'
      - uses: docker/login-action@v3
        if: steps.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: published-image
        if: steps.version.outputs.publish == 'true'
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mick7784/halloween-map:${{ steps.version.outputs.value }}
            ghcr.io/mick7784/halloween-map:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Pull and verify published version and latest
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_DIGEST: ${{ steps.published-image.outputs.digest }}
        run: |
          for tag in "$RELEASE_VERSION" latest; do
            image="ghcr.io/mick7784/halloween-map:$tag"
            docker pull "$image"
            test "$(docker run --rm --entrypoint cat "$image" VERSION | tr -d '\r\n')" = "$RELEASE_VERSION"
            test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$RELEASE_VERSION"
            test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$RELEASE_SHA"
            docker image inspect "$image" --format '{{json .RepoDigests}}' | grep -F "$RELEASE_DIGEST"
            echo "Verified $image — $RELEASE_SHA — $RELEASE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Tag and GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" -m "Halloween Map $VERSION Beta"
          git push origin "$VERSION"
          awk -v v="$VERSION" '$0 ~ "^## " v "([ —]|$)" {found=1;next} /^## / && found {exit} found {print}' CHANGELOG.md > release-notes.md
          gh release create "$VERSION" --verify-tag --title "Halloween Map $VERSION Beta" --notes-file release-notes.md --prerelease
